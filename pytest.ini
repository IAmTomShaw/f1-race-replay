[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    unit: pure-Python unit tests; no I/O, no GUI, no graphics.
    integration: tests that exercise multiple modules or subprocess boundaries.
    graphics: tests that require Arcade, OpenGL, or a physical GPU.
    gui: tests that require PySide6 / Qt.
    data: tests that load real FastF1 session data; slow and network-dependent.
    streaming: tests that exercise the TCP telemetry stream.
    slow: tests that take more than 1 second.
